[tools]
gh = "2.104.0"
jq = "1.8.2"
yq = "4.54.3"
zoxide = "0.10.0"
btop = "1.4.8"
node = "26.13.1"
pnpm = "12.21.0"
python = "3.15.2"
uv = "0.13.8"
kubectl = "1.36.2"
talosctl = "1.13.5"
omnictl = "1.9.1"
opentofu = "1.13.9"
infisical = { version = "0.45.4", asset_pattern = "cli_{{ version }}_{{ os(macos='darwin') }}_{{ arch(x64='amd64') }}.tar.gz" }
herdr = "0.9.5"
claude-code = "2.1.325"
oh-my-pi = "18.20.2"
opencode = "2.3.0"

[vars]
# Resolve the physical checkout for tasks loaded through the conf.d folder link.
dotfile_root = "{{ config_source | canonicalize | dirname }}"

[dotfiles]
"~/.config/opencode/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.omp/agent/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.agents/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.pi/agent/AGENTS.md" = { source = "agents/AGENTS.md", mode = "symlink" }
"~/.config/opencode/skills" = { source = "agents/skills", mode = "symlink" }
"~/.agents/skills" = { source = "agents/skills", mode = "symlink" }
"~/.pi/agent/skills" = { source = "agents/skills", mode = "symlink" }
"~/.claude/skills" = { source = "agents/skills", mode = "symlink" }
"~/.config/herdr/config.toml" = { source = "herdr/config.toml", mode = "symlink" }
"~/.config/nvim" = { source = "nvim", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "tmux/tmux.conf", mode = "symlink" }

[tasks.herdr-plugins]
description = "Install missing plugins declared in herdr/plugins.yaml"
run = "bash {{ vars.dotfile_root | quote }}/herdr/sync-plugins.sh"
