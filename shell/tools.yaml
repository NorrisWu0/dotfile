tools:
  zoxide:
    command: zoxide
    installation_hint: https://github.com/ajeetdsouza/zoxide

  nvm:
    command: nvm
    installation_hint: https://github.com/nvm-sh/nvm

  gh:
    command: gh
    installation_hint: https://github.com/cli/cli

  tmux:
    command: tmux
    installation_hint: https://github.com/tmux/tmux/wiki/Installing

  kubectl:
    command: kubectl
    installation_hint: https://kubernetes.io/docs/tasks/tools/

  omnictl:
    command: omnictl
    installation_hint: https://github.com/siderolabs/omni/releases/tag/v1.9.1

  talosctl:
    command: talosctl
    installation_hint: https://github.com/siderolabs/talos

  yq:
    command: yq
    installation_hint: https://github.com/mikefarah/yq
