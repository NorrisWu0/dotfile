TOOLS_CONFIG_FILE="$SHELL_CONFIG_DIR/tools.yaml"

# Respect initializers already provided by the user's shell configuration.
if command -v zoxide >/dev/null 2>&1 && ! command -v __zoxide_z >/dev/null 2>&1; then
    if [[ -n "${ZSH_VERSION:-}" ]]; then
        eval "$(zoxide init zsh)"
    else
        eval "$(zoxide init bash)"
    fi
fi
if ! command -v nvm >/dev/null 2>&1 && [[ -r /usr/share/nvm/init-nvm.sh ]]; then
    source /usr/share/nvm/init-nvm.sh
fi

tools_check() {
    local name command installation_hint

    if ! command -v yq >/dev/null 2>&1; then
        printf 'tools-check: install yq: https://github.com/mikefarah/yq\n' >&2
        return 1
    fi

    while IFS=$'\t' read -r name command installation_hint; do
        if command -v "$command" >/dev/null 2>&1; then
            printf 'ok       %s\n' "$name"
        else
            printf 'missing  %s\n         install: %s\n' "$name" "$installation_hint"
        fi
    done < <(yq -r '
        .tools
        | to_entries[]
        | [.key, .value.command, (.value.installation_hint // "")]
        | @tsv
    ' "$TOOLS_CONFIG_FILE")
}

alias tools-check >/dev/null 2>&1 || alias tools-check='tools_check'
