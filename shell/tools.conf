TOOLS_CONFIG_FILE="$SHELL_CONFIG_DIR/tools.yaml"
YQ_INSTALLATION_HINT="https://github.com/mikefarah/yq"

if ! command -v yq >/dev/null 2>&1; then
    printf 'bashrc: yq is missing; skipping tool initialization. Install: %s\n' \
        "$YQ_INSTALLATION_HINT" >&2
    return 0
fi

tools_registry() {
    yq -r '
        .tools
        | to_entries[]
        | [
            .key,
            .value.command,
            (.value.initialization_command // "__NO_INIT__"),
            (.value.installation_hint // "")
          ]
        | @tsv
    ' "$TOOLS_CONFIG_FILE"
}

tools_init() {
    local name command initialization_command installation_hint

    while IFS=$'\t' read -r name command initialization_command installation_hint; do
        [[ "$initialization_command" != "__NO_INIT__" ]] || continue
        if ! eval "$initialization_command"; then
            printf 'bashrc: initialization failed for %s\n' "$name" >&2
        fi
    done < <(tools_registry)
}

tools_check() {
    local name command initialization_command installation_hint

    while IFS=$'\t' read -r name command initialization_command installation_hint; do
        if command -v "$command" >/dev/null 2>&1; then
            printf 'ok       %s\n' "$name"
        else
            printf 'missing  %s\n         install: %s\n' \
                "$name" "$installation_hint"
        fi
    done < <(tools_registry)
}

alias tools-check='tools_check'
tools_init
