version: 1
modules:
  - name: hypr
    links:
      - source: hypr/looknfeel.lua
        targets:
          - ~/.config/hypr/looknfeel.lua

  - name: waybar
    links:
      - source: waybar/config.jsonc
        targets:
          - ~/.config/waybar/config.jsonc
      - source: waybar/style.css
        targets:
          - ~/.config/waybar/style.css

  - name: nvim
    links:
      - source: nvim
        targets:
          - ~/.config/nvim

  - name: tmux
    links:
      - source: tmux/tmux.conf
        targets:
          - ~/.config/tmux/tmux.conf

  - name: herdr
    links:
      - source: herdr/config.toml
        targets:
          - ~/.config/herdr/config.toml

  - name: omarchy
    links:
      - source: omarchy/branding/about.txt
        targets:
          - ~/.config/omarchy/branding/about.txt
      - source: omarchy/branding/screensaver.txt
        targets:
          - ~/.config/omarchy/branding/screensaver.txt

  - name: agents
    links:
      - source: agents/AGENTS.md
        targets:
          - ~/.config/opencode/AGENTS.md
          - ~/.omp/agent/AGENTS.md
      - source: agents/skills
        targets:
          - ~/.agents/skills
          - ~/.config/opencode/skills

  - name: shell
    links:
      - source: shell
        targets:
          - ~/.config/dotfile/shell
